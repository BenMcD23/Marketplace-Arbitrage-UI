<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="Dashboard for the marketplace arbitrage pipeline: underpriced eBay listings valued against real resale data."
    />
    <title>Marketplace Arbitrage</title>
    <script>
      // Apply the stored theme before first paint so the page never flashes the
      // wrong background on load.
      (function () {
        var stored = localStorage.getItem('theme')
        if (stored === 'light' || stored === 'dark') {
          document.documentElement.dataset.theme = stored
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
